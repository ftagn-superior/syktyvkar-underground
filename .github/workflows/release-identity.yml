# Временная проверка: какой авторский выпуск (assetReleaseVersion, seedVersion, mapVersion)
# собирается на Linux. Удаляется до слияния ветки.
name: release identity (temporary)
on:
  push:
    branches: ["feat/**"]
jobs:
  identity:
    strategy:
      matrix:
        ref: ["${{ github.ref_name }}", main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build world and print release identity
        run: |
          sed -i 's/`Canonical terrain ${key} changed; review and update the accepted authoring release`,/`Canonical terrain ${key} changed ACTUAL=${JSON.stringify(actual)}`,/' tools/world-build/src/terrain-release-source.ts
          node --import tsx tools/world-build/src/index.ts > build.log 2>&1 && echo "IDENTITY MATCHES PIN" || true
          grep -o 'ACTUAL=.*' build.log | head -1 || true
          grep -m3 'Error' build.log || true
          node -e "const r=require('./content/worlds/ring-block/terrain-release.json');console.log('PIN='+JSON.stringify(r.expected))"
